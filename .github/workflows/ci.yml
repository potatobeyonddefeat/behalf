name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  linux-validation:
    name: Linux validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.17"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build app
        run: npm run build

      - name: Build CLI
        run: npm run build:cli

      - name: Build egress-proxy
        run: npm run build:egress-proxy

      - name: Full unit test suite
        run: npx vitest run

      - name: Package unit tests
        run: npm run test:packages

      - name: Workspace slug Mongo integration
        run: >
          npx vitest run
          --config vitest.integration.config.ts
          test/integration/workspace-slug-sparse.integration.test.ts

      - name: Verify CLI package provenance metadata
        run: |
          set -euo pipefail
          EXPECTED_VERSION=$(node -p "require('./packages/cli/package.json').version")
          node scripts/release/verify-cli-package-metadata.mjs \
            packages/cli/package.json \
            "$EXPECTED_VERSION" \
            "BehalfID/behalf"

      - name: Focused security and CLI tests
        run: |
          npx vitest run \
            test/cli-hook.test.ts \
            test/approval-intent.test.ts \
            test/approval-request.test.ts \
            test/dashboard-approvals-route.test.ts \
            test/dashboard-inbox-route.test.ts \
            test/ops-approval-ui.test.ts \
            test/verify.test.ts

      - name: Release helper tests
        run: |
          npx vitest run \
            test/verify-cli-artifact.test.ts \
            test/verify-cli-package-metadata.test.ts \
            test/render-homebrew-formula.test.ts \
            test/install-sh.test.ts \
            test/cli-standalone-version.test.ts

      - name: Standalone Linux binary version gate
        run: |
          set -euo pipefail
          chmod +x scripts/release/build-cli-binaries.sh
          scripts/release/build-cli-binaries.sh linux-x64
          EXPECTED=$(node -p "require('./packages/cli/package.json').version")
          ACTUAL=$(./packages/cli/bin/behalf-linux-x64 --version | tr -d '\r')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "Standalone binary --version was '$ACTUAL', expected '$EXPECTED'"
            exit 1
          fi
          echo "Standalone binary version OK: $ACTUAL"
          TMPDIR_EMPTY=$(mktemp -d)
          cp ./packages/cli/bin/behalf-linux-x64 "$TMPDIR_EMPTY/behalf"
          (
            cd "$TMPDIR_EMPTY"
            EMPTY_ACTUAL=$(./behalf --version | tr -d '\r')
            if [ "$EMPTY_ACTUAL" != "$EXPECTED" ]; then
              echo "Empty-dir binary --version was '$EMPTY_ACTUAL', expected '$EXPECTED'"
              exit 1
            fi
            echo "Empty-dir standalone binary version OK: $EMPTY_ACTUAL"
          )
          rm -rf "$TMPDIR_EMPTY"

  postgres-schema:
    name: Postgres schema smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        # Pull via Google's Docker Hub mirror — registry-1.docker.io often
        # times out ("context deadline exceeded") from shared Actions runners.
        image: mirror.gcr.io/library/postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: behalf_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d behalf_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_TEST_URL: postgres://postgres:postgres@localhost:5432/behalf_ci
      RUN_POSTGRES_MIGRATION_SMOKE: "true"
      RUN_POSTGRES_REPOSITORY_CONTRACTS: "true"
      RUN_POSTGRES_API_FLOWS: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Migration smoke
        run: npm run test:postgres-smoke

      - name: Repository contracts
        run: npm run test:postgres-repositories

      # Critical agent/token flows against the real adapters. These are the
      # cases the mocked suites cannot see: foreign keys, unsupported filter
      # operators, and Mongo-only query methods.
      - name: API critical flows (real Postgres)
        run: npm run test:api-postgres -- --reporter=json --outputFile=/tmp/api-postgres.json

      # A critical suite that quietly skips must fail the job. Read vitest's
      # JSON report rather than grepping colourised console output.
      - name: Assert the Postgres API suite actually ran
        run: |
          node -e "
            const report = require('/tmp/api-postgres.json');
            const total = report.numTotalTests ?? 0;
            const passed = report.numPassedTests ?? 0;
            if (total < 20) {
              console.error('::error::Postgres API flow suite ran only ' + total + ' tests — it skipped.');
              process.exit(1);
            }
            console.log('Postgres API flows executed: ' + passed + '/' + total + ' passed.');
          "

  api-contracts:
    name: API route contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The generated matrix is the inventory the contract suite is measured
      # against; a stale one hides newly added routes.
      - name: API inventory is current
        run: npm run api:inventory:check

      - name: Route contracts and Postgres compatibility guards
        run: npm run test:api-contracts

  windows-cli:
    name: Windows CLI
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build CLI
        run: npm run build:cli

      - name: Focused CLI tests
        run: npx vitest run test/cli-hook.test.ts test/approval-intent.test.ts test/verify.test.ts

      - name: CLI version smoke
        run: |
          $expected = (node -p "require('./packages/cli/package.json').version").Trim()
          $out = (node packages/cli/dist/index.js --version).Trim()
          if ($out -ne $expected) {
            Write-Error "Expected CLI version $expected, got '$out'"
            exit 1
          }
          Write-Host "CLI version OK: $out"
